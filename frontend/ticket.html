<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brote — Ticket</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar-brote">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="brote-logo">
                <img src="img/brote-icon.png" alt="brote" class="brote-icon-img">brote
            </a>
            <button id="btnTema" class="icon-btn fs-5">🌙</button>
        </div>
    </nav>
    <div class="marca-alumna">Trabajo Integrador · Programación III · Agustina Loureiro</div>

    <div class="container my-5">
        <div id="ticketBox" class="ticket-box shadow-sm">
            <div class="text-center mb-3">
                <img src="img/brote-icon.png" alt="brote" style="width:44px;height:44px;">
                <h4 class="mb-0">brote</h4>
                <small class="text-muted">¡Gracias por tu compra!</small>
            </div>
            <hr>
            <p class="mb-1"><strong>Cliente:</strong> <span id="ticketNombre"></span></p>
            <p class="mb-3"><strong>Fecha:</strong> <span id="ticketFecha"></span></p>

            <table class="table table-sm">
                <thead>
                    <tr><th>Producto</th><th class="text-center">Cant.</th><th class="text-end">Subtotal</th></tr>
                </thead>
                <tbody id="ticketItems"></tbody>
            </table>

            <hr>
            <h5 class="text-end">Total: $<span id="ticketTotal">0.00</span></h5>
        </div>

        <div class="text-center mt-4 d-flex flex-column flex-sm-row justify-content-center gap-2">
            <button id="btnDescargarPDF" class="btn btn-outline-secondary">⬇️ Descargar PDF</button>
            <button id="btnNuevaCompra" class="btn btn-primario">Salir</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/carrito-utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ticket.js"></script>
</body>
</html>

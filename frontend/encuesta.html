<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brote — Encuesta</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar-brote">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="brote-logo">
                <img src="img/brote-icon.png" alt="brote" class="brote-icon-img">brote
            </a>
            <button id="btnTema" class="icon-btn fs-5">🌙</button>
        </div>
    </nav>
    <div class="marca-alumna">Trabajo Integrador · Programación III · Agustina Loureiro</div>

    <div class="container my-4" style="max-width: 560px;">
        <div class="text-center mb-4">
            <h3 class="font-display">¿Cómo fue tu experiencia?</h3>
            <p class="text-muted">Tu opinión nos ayuda a mejorar 🌿</p>
        </div>

        <form id="formEncuesta" class="card p-4" novalidate enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Puntuación del servicio</label>
                <input type="range" class="form-range" id="puntaje" name="puntaje" min="1" max="5" value="3">
                <div class="text-center" id="puntajeValor">3 / 5</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Contanos tu opinión</label>
                <textarea class="form-control" id="comentario" name="comentario" rows="3" required minlength="5"></textarea>
                <div class="invalid-feedback">Escribí al menos 5 caracteres.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Tu email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="invalid-feedback">Ingresá un email válido.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Foto (opcional)</label>
                <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="acepta_novedades" name="acepta_novedades">
                <label class="form-check-label" for="acepta_novedades">Quiero recibir novedades y promociones</label>
            </div>

            <button type="submit" class="btn btn-primario">Enviar opinión</button>
        </form>

        <div class="text-center mt-3">
            <a href="#" id="btnOmitir" class="text-muted small">Omitir encuesta</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/theme.js"></script>
    <script src="js/carrito-utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/encuesta.js"></script>
</body>
</html>
